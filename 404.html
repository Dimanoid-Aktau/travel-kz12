<!DOCTYPE html>
<html lang="ru">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --terra: #C05A3E;
      --ochre: #D98236;
      --navy:  #1B365D;
      --navy-dark: #0d1824;
      --cream: #F7F3EB;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--navy-dark);
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }
    img { display: block; max-width: 100%; }

    .nf-bg {
      position: fixed;
      inset: 0;
      background: url('BG/hero-poster.jpg') center/cover no-repeat;
      opacity: .28;
      z-index: 0;
    }
    .nf-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(13,24,36,.72) 0%, rgba(13,24,36,.92) 100%);
    }

    .nf-nav {
      position: relative;
      z-index: 2;
      padding: 22px 48px;
    }
    .nf-nav img { height: 44px; width: auto; }

    .nf-main {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px 70px;
    }
    .nf-code {
      font-size: clamp(90px, 18vw, 190px);
      font-weight: 900;
      line-height: .9;
      letter-spacing: -4px;
      color: transparent;
      -webkit-text-stroke: 2px rgba(255,255,255,.28);
      margin-bottom: 26px;
    }
    .nf-main h1 {
      font-size: clamp(22px, 3.6vw, 36px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -.3px;
      margin-bottom: 16px;
    }
    .nf-main p {
      font-size: 15.5px;
      line-height: 1.8;
      color: rgba(255,255,255,.6);
      max-width: 480px;
      margin-bottom: 36px;
    }
    .nf-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px 18px;
    }
    .nf-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 15px 34px;
      border-radius: 100px;
      background: var(--terra);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: background .25s ease, transform .1s ease;
    }
    .nf-btn:hover  { background: var(--navy); }
    .nf-btn:active { transform: scale(.97); }
    .nf-btn.ghost {
      background: transparent;
      border: 1.5px solid rgba(255,255,255,.35);
    }
    .nf-btn.ghost:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.6); }
    .nf-btn:focus-visible { outline: 2px solid var(--ochre); outline-offset: 3px; }

    .nf-foot {
      position: relative;
      z-index: 2;
      padding: 0 24px 34px;
      text-align: center;
      font-size: 12.5px;
      color: rgba(255,255,255,.35);
    }
    .nf-foot a { color: rgba(255,255,255,.6); border-bottom: 1px solid rgba(255,255,255,.2); }
    .nf-foot a:hover { color: #fff; }

    @media (max-width: 768px) {
      .nf-nav { padding: 18px 20px; }
      .nf-nav img { height: 38px; }
      .nf-main { padding: 20px 20px 50px; }
      .nf-main p { font-size: 14.5px; }
      .nf-btn { padding: 14px 26px; font-size: 10px; letter-spacing: 2.4px; }
    }
  </style>
</head>
<body>

<div class="nf-bg" aria-hidden="true"></div>

<header class="nf-nav">
  <a href="index.html" aria-label="TRAVEL KZ12">
    <img src="NEW-LOGO.svg" alt="TRAVEL KZ12">
  </a>
</header>

<main class="nf-main">
  <div class="nf-code" aria-hidden="true">404</div>
  <h1 data-t="title">Здесь только степь</h1>

  <div class="nf-actions">
    <a class="nf-btn" href="index.html" data-t="home">На главную</a>
    <a class="nf-btn ghost" href="index.html#routes" data-t="routes">Все маршруты</a>

</main>

<footer class="nf-foot">

  ·
  <a href="tel:+77016442444">+7 701 644 2444</a>
</footer>

<script>
(function () {
  'use strict';
  var T = {
    en: { title: 'Nothing but steppe here',
          sub: 'This page does not exist — it may have moved, or there is a typo in the address. Our routes, however, are very much real.',
          home: 'Home', routes: 'All tours', help: 'Can’t find what you need? Write to us —' },
    de: { title: 'Hier ist nur Steppe',
          sub: 'Diese Seite gibt es nicht — vielleicht ist sie umgezogen oder die Adresse enthält einen Tippfehler. Unsere Touren gibt es dafür wirklich.',
          home: 'Startseite', routes: 'Alle Touren', help: 'Nicht gefunden, was Sie suchen? Schreiben Sie uns —' },
    fr: { title: 'Ici, rien que la steppe',
          sub: 'Cette page n’existe pas — elle a peut-être été déplacée, ou l’adresse contient une faute. Nos circuits, eux, existent bel et bien.',
          home: 'Accueil', routes: 'Tous les circuits', help: 'Vous ne trouvez pas ? Écrivez-nous —' }
  };
  var lang = '';
  try { lang = localStorage.getItem('lang') || ''; } catch (e) {}
  if (!T[lang]) lang = (navigator.language || '').slice(0, 2).toLowerCase();
  var dict = T[lang];
  if (!dict) return;                       // русский уже в разметке
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(function (el) {
    var v = dict[el.getAttribute('data-t')];
    if (v) el.textContent = v;
  });
  document.title = dict.title + ' — TRAVEL KZ12';
})();
</script>

</body>
</html>
